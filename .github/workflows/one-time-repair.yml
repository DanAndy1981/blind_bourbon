name: One-time Bourbon Derby repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Firebase SDK version and remove this workflow
        shell: bash
        run: |
          sed -i "s/const FIREBASE_VERSION = '12.17.1';/const FIREBASE_VERSION = '12.16.0';/" js/store.js
          rm -f .github/workflows/one-time-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/store.js .github/workflows/one-time-repair.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix Firebase SDK version"
            git push
          fi
