name: Bourbon Derby checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/claim-guard.js
          node --check js/registration-draft.js
          node --check js/master-reset.js
          node --check sw.js
      - name: Run tests
        run: node --test tests/*.test.mjs
